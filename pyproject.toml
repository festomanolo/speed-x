[build-system]
# Keep Core Metadata 2.4 compatibility with the validated Twine 6 release path.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "speed-x"
version = "1.0.0"
description = "Local Speed-X typed decisions on Apple Core ML and Neural Engine with Liquid Glass macOS assistant"
keywords = ["coreml", "neural-engine", "speed-x", "decision-model", "apple-silicon", "local-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "coremltools>=9,<10",
    "numpy>=1.26,<2.2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.34,<2",
    "safetensors>=0.6",
    "rumps>=0.4.0",
]

[project.optional-dependencies]
convert = ["torch==2.7.0", "safetensors>=0.6"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1", "psutil>=6"]
compare = ["laya-mlx==0.2.0"]
research = ["kmeans1d==0.4.0"]
demo = ["rich>=15,<16", "Pillow>=12,<13"]
publish = ["twine>=6,<7"]

[project.scripts]
speed-x = "main:main"
speedx = "main:main"
laya-coreml = "laya_coreml.cli:main"
laya-coreml-snake = "laya_coreml.snake.cli:main"

[project.urls]
Repository = "https://github.com/festomanolo/speed-x"
Upstream = "https://github.com/NandhaKishorM/laya"
Documentation = "https://github.com/festomanolo/speed-x#readme"
Issues = "https://github.com/festomanolo/speed-x/issues"
Benchmarks = "https://github.com/festomanolo/speed-x/blob/main/docs/ANE_BENCHMARKS.md"

[tool.hatch.build.targets.wheel]
packages = ["speed_x", "laya_coreml"]

[tool.hatch.build.targets.sdist]
include = ["/laya_coreml", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
